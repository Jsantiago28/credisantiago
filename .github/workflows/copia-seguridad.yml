# Copia de la base de datos cada semana (Supabase gratis no hace copias).
#
# Queda en GitHub → Actions → la corrida → "Artifacts", cifrada con la
# contraseña BACKUP_PASSWORD (tiene cédulas y teléfonos de clientes).
# Las fotos NO entran: esas siguen solo en Supabase Storage.
#
# Necesita dos secretos (GitHub → Settings → Secrets and variables → Actions):
#   SUPABASE_DB_PASSWORD  la contraseña de la base de datos de Supabase
#                         (se cambia en Database → Settings → Reset password).
#   BACKUP_PASSWORD       una contraseña que tú inventes para cifrar la copia.
#                         Guárdala bien: sin ella la copia no se puede abrir.
#
# Se conecta por el "Session pooler" de us-east-1 (la conexión directa no
# llega desde GitHub). Supabase usa aws-0 o aws-1 según el proyecto: se
# prueban los dos.
#
# Para abrir una copia:  gpg --decrypt copia.tar.gz.gpg > copia.tar.gz
name: Copia de seguridad semanal

on:
  schedule:
    - cron: '0 9 * * 0'   # domingos, 5:00 a. m. de RD
  workflow_dispatch:

jobs:
  copia:
    runs-on: ubuntu-latest
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Sacar la copia
        env:
          CLAVE: ${{ secrets.SUPABASE_DB_PASSWORD }}
          CANDADO: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          # Sin la contraseña del candado la copia quedaría sin cifrar: no se saca.
          if [ -z "$CANDADO" ]; then
            echo "Falta el secreto BACKUP_PASSWORD: no se saca la copia."
            exit 1
          fi
          mkdir copia
          # La contraseña puede traer @, # o / y hay que escaparlos en la URL.
          clave=$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["CLAVE"], safe=""))')
          echo "::add-mask::$clave"
          for servidor in aws-1-us-east-1 aws-0-us-east-1; do
            url="postgresql://postgres.twhwjttwpliudqkkgzsq:$clave@$servidor.pooler.supabase.com:5432/postgres"
            if supabase db dump --db-url "$url" -f copia/roles.sql --role-only; then
              echo "Conectó por $servidor"
              break
            fi
            url=""
          done
          if [ -z "$url" ]; then
            echo "No se pudo conectar. Revisa el secreto SUPABASE_DB_PASSWORD."
            exit 1
          fi
          supabase db dump --db-url "$url" -f copia/esquema.sql
          supabase db dump --db-url "$url" -f copia/datos.sql --use-copy --data-only

      - name: Cifrar
        env:
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          nombre="copia-$(date +%Y-%m-%d).tar.gz"
          tar -czf "$nombre" copia
          gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase "$BACKUP_PASSWORD" -o "$nombre.gpg" "$nombre"
          echo "ARCHIVO=$nombre.gpg" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVO }}
          path: ${{ env.ARCHIVO }}
          retention-days: 60
