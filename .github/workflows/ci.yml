# Pruebas automáticas: en cada cambio que llega a GitHub se revisa el código
# (flutter analyze) y se corren todas las pruebas (flutter test). Si algo
# falla, la web NO se publica (ver publicar-web.yml).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Revisar y probar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Revisar el código
        run: flutter analyze

      - name: Pruebas
        run: flutter test
