# Aplica solas en la base de datos de VERDAD las migraciones nuevas
# (supabase/migracion_*.sql), pero solo después de que las pruebas de la
# base de datos pasen en main. Cada una se corre entera o nada, y se anota
# en control.migraciones para no correrla dos veces.
#
# OJO: una migración ya aplicada NO se vuelve a correr aunque se edite el
# archivo: para cambiar algo, se hace una migración nueva.
#
# Necesita el secreto SUPABASE_ACCESS_TOKEN (supabase.com → Account →
# Access Tokens). Si falta, no hace nada y termina en verde.
name: Aplicar migraciones

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Pruebas de la base de datos]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: aplicar-migraciones
  cancel-in-progress: false

jobs:
  aplicar:
    name: Aplicar en producción
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Solo si las pruebas pasaron, con un push a main de este mismo repositorio.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Aplicar las migraciones nuevas
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: twhwjttwpliudqkkgzsq
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::Falta el secreto SUPABASE_ACCESS_TOKEN: no se aplica nada."
            exit 0
          fi
          bash supabase/pruebas/aplicar_migraciones.sh
