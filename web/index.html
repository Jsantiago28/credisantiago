<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="La app para prestamistas: lleva tus préstamos y cobros al día desde el celular.">
  <meta property="og:site_name" content="CrediSantiago">
  <meta property="og:title" content="CrediSantiago">
  <meta property="og:description" content="La app para prestamistas: lleva tus préstamos y cobros al día desde el celular.">
  <meta property="og:image" content="https://credisantiago.pages.dev/icons/Icon-512.png">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F3F5F4">
  <!-- La app y los links de clientes no van en los buscadores. -->
  <meta name="robots" content="noindex">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="CrediSantiago">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>CrediSantiago</title>
  <link rel="manifest" href="manifest.json">
  <!-- Poner la app en la pantalla de inicio: Chrome, Samsung y Edge avisan
       con "beforeinstallprompt" apenas carga la página, antes que la app; se
       guarda para el botón "Instalar" de la app (lib/instalar/). El iPhone
       no tiene este aviso: ahí la app explica los pasos. -->
  <script>
    window.credi = { aviso: null };
    window.addEventListener("beforeinstallprompt", function (e) {
      e.preventDefault();
      window.credi.aviso = e;
      window.dispatchEvent(new Event("credi-instalacion"));
    });
    window.addEventListener("appinstalled", function () {
      window.credi.aviso = null;
      window.credi.instalada = true;
      window.dispatchEvent(new Event("credi-instalacion"));
    });
    window.crediInstalar = function () {
      var aviso = window.credi.aviso;
      if (!aviso) return Promise.resolve("no-disponible");
      aviso.prompt();
      return aviso.userChoice.then(function (r) {
        window.credi.aviso = null;
        return r.outcome;
      });
    };
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- Impresora de tickets (Bluetooth directo y RawBT) -->
  <script src="impresora.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
