name: prestamistas_rd
description: App para prestamistas de la calle RD - captacion por link y organizacion de cobros.
publish_to: 'none'
version: 1.0.7+8

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  supabase_flutter: ^2.16.0
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  geolocator: ^12.0.0
  intl: ^0.19.0
  share_plus: ^9.0.0
  excel: ^4.0.6
  path_provider: ^2.1.3
  pdf: ^3.12.0
  printing: ^5.13.1
  url_launcher: ^6.3.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  fl_chart: ^1.2.0
  shared_preferences: ^2.5.6
  file_picker: 8.0.7
  package_info_plus: ^9.0.1
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.2
  flutter_secure_storage: ^10.3.4
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/icono.png

# Íconos de la app de Android a partir del logo. Para regenerarlos:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/branding/icono.png"
  android: true
  ios: false
  min_sdk_android: 24
  # Android recorta el ícono en círculo o cuadrado: símbolo sobre el fondo.
  adaptive_icon_background: "assets/branding/icono_fondo.png"
  adaptive_icon_foreground: "assets/branding/icono_simbolo.png"
  # La imagen ya trae su margen: sin el 16% extra que pone por defecto.
  adaptive_icon_foreground_inset: 0
  # Los de la web (web/icons, favicon) se hacen aparte desde
  # assets/branding/logo.svg: este paquete pisaría el manifest.json.
  web:
    generate: false
