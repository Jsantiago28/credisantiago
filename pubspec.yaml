name: prestamistas_rd
description: App para prestamistas de la calle RD - captacion por link y organizacion de cobros.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  supabase_flutter: ^2.5.6
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  geolocator: ^12.0.0
  intl: ^0.19.0
  pin_code_fields: ^8.0.1
  share_plus: ^9.0.0
  go_router: ^14.2.0
  excel: ^4.0.6
  path_provider: ^2.1.3
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  pdf: ^3.12.0
  printing: ^5.13.1
  url_launcher: ^6.3.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  fl_chart: ^1.2.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
