name: prestamistas_rd
description: App para prestamistas de la calle RD - captacion por link y organizacion de cobros.
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  supabase_flutter: ^2.5.6
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  geolocator: ^12.0.0
  intl: ^0.19.0
  pin_code_fields: ^8.0.1
  share_plus: ^9.0.0
  go_router: ^14.2.0
  excel: ^4.0.6
  path_provider: ^2.1.3
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  pdf: ^3.12.0
  printing: ^5.13.1
  url_launcher: ^6.3.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  fl_chart: ^1.2.0
  shared_preferences: ^2.5.6
  file_picker: 8.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/icono.png

# Íconos de la app (Android y web) a partir del logo. Para regenerarlos:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/branding/icono.png"
  android: true
  ios: false
  min_sdk_android: 24
  # Android recorta el ícono en círculo o cuadrado: símbolo sobre el fondo.
  adaptive_icon_background: "assets/branding/icono_fondo.png"
  adaptive_icon_foreground: "assets/branding/icono_simbolo.png"
  # La imagen ya trae su margen: sin el 16% extra que pone por defecto.
  adaptive_icon_foreground_inset: 0
  web:
    generate: true
    image_path: "assets/branding/icono.png"
    background_color: "#F3F5F4"
    theme_color: "#2B5FD9"
